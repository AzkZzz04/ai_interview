spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:4}
      minimum-idle: 0
      connection-timeout: 5000
  flyway:
    enabled: false

app:
  supabase:
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    ssl-root-cert: ${SUPABASE_SSL_ROOT_CERT}

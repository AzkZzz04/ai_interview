name: Build and publish images

on:
  push:
    branches:
      - docker-kubernetes-gitops
    # The workflow's own commit changes only this file, so do not rebuild the
    # same source revision indefinitely.
    paths-ignore:
      - deploy/ai-interview/values.yaml
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/azkzzz04/ai-interview-api
  WEB_IMAGE: ghcr.io/azkzzz04/ai-interview-web

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend checks
        run: ./gradlew check --no-daemon

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Type-check frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Test frontend
        working-directory: apps/web
        run: npm test

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8080
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-helm-values:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Pin Helm images to the built source revision
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          perl -0pi -e '
            s{(api:\n  image:\n    repository: )[^\n]+}{$1 . $ENV{API_IMAGE}}e;
            s{(worker:\n(?:  \# [^\n]*\n)*  image:\n    repository: )[^\n]+}{$1 . $ENV{API_IMAGE}}e;
            s{(web:\n  image:\n    repository: )[^\n]+}{$1 . $ENV{WEB_IMAGE}}e;
            s{((?:api|worker|web):\n(?:  \# [^\n]*\n)*  image:\n    repository: [^\n]+\n    tag: )[^\n]+}{$1 . $ENV{IMAGE_TAG}}eg;
          ' deploy/ai-interview/values.yaml

      - name: Commit desired image SHAs
        run: |
          git diff --check
          if git diff --quiet -- deploy/ai-interview/values.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/ai-interview/values.yaml
          git commit -m "chore(deploy): pin images to ${GITHUB_SHA}"
          git push

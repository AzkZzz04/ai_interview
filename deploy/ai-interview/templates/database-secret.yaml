apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-interview.fullname" . }}-postgres
  labels:
    {{- include "ai-interview.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.auth.password is required" .Values.postgres.auth.password | quote }}
  DATABASE_PASSWORD: {{ required "postgres.auth.password is required" .Values.postgres.auth.password | quote }}
